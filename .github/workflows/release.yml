name: Release

# Releases are cut by pushing an annotated/signed semver tag:
#
#   git tag -s v0.1.0 -m "perch v0.1.0"
#   git push origin v0.1.0
#
# See RELEASING.md for the full process.
on:
  push:
    tags:
      - "v*"

# Read-only by default. The release job asks for the minimum it needs.
permissions:
  contents: read

# Never cancel a release halfway through. Queue duplicate tag pushes instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a semantic version (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      # Prevent an accidental release from a feature or maintenance branch.
      # Remove this step if you later need to support release branches.
      - name: Ensure the tag is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod declares the minimum supported version (1.26.4); official
          # builds use the latest patched Go 1.26.x to avoid known stdlib CVEs.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers or a deployment branch policy to this environment
    # in the repository settings to gate releases.
    environment:
      name: release
      url: https://github.com/synqronlabs/perch/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing and provenance attestation
      attestations: write # GitHub build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags are required for the changelog and version.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod declares the minimum supported version (1.26.4); official
          # builds use the latest patched Go 1.26.x to avoid known stdlib CVEs.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
