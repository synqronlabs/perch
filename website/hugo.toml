baseURL = 'https://perch.mxraven.com/'
title = 'perch'
theme = 'github.com/alex-shpak/hugo-book'
enableGitInfo = true
disablePathToLower = true

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  style = 'github'
  noClasses = false
[markup.tableOfContents]
  startLevel = 1

[params]
  BookSection = 'docs'
  BookFavicon = 'favicon.svg'
  BookSearch = true
  BookToC = true
  BookBreadcrumbs = true
  BookRepo = 'https://github.com/synqronlabs/perch'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/website/{{ .Path }}'
  BookPortableLinks = 'error'
  BookDateFormat = '2006-01-02'
  BookTheme = 'auto'
  UmamiWebsiteID = 'f1009ca3-35c2-46c7-9895-1a6c72217647'

